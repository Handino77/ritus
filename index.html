<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuGenius - Tu Asistente de Documentación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
            --danger-color: #dc3545;
            --danger-hover: #bb2d3b;
            --success-color: #198754;
            --light-gray: #f8f9fa;
            --gray-border: #dee2e6;
            --text-color: #212529;
            --white: #fff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-gray);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 20px 25px;
            text-align: center;
        }
        header h1 { margin: 0; font-size: 1.8em; }
        main { padding: 25px 30px; }
        form label {
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
        }
        form input[type="text"], form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        form input[type="text"]:focus, form textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
            outline: none;
        }
        .checkbox-group {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .checkbox-group div {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover { transform: translateY(-2px); }
        button:disabled { cursor: not-allowed; background-color: #ccc !important; }
        .btn-primary { background-color: var(--primary-color); color: var(--white); }
        .btn-primary:hover { background-color: var(--primary-hover); }
        #result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background-color: var(--light-gray);
            border: 1px solid var(--gray-border);
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .download-links a {
            display: inline-block;
            text-decoration: none;
            background-color: var(--success-color);
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            margin: 5px;
            transition: background-color 0.2s;
        }
        .download-links a:hover { background-color: #157347; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>DocuGenius</h1>
        </header>
        <main>
            <section id="app-section">
                <form id="company-form">
                    <label for="company-name">Nombre de la Empresa:</label>
                    <input type="text" id="company-name" required placeholder="Ej: Innovatech Solutions">

                    <label for="company-desc">Breve descripción de la empresa:</label>
                    <textarea id="company-desc" rows="3" required placeholder="Ej: Empresa dedicada al desarrollo de software..."></textarea>

                    <label for="departments">Departamentos (separados por comas):</label>
                    <input type="text" id="departments" placeholder="Ej: Ventas, Marketing, Desarrollo" required>

                    <label for="processes">Procesos Clave (separados por comas):</label>
                    <input type="text" id="processes" placeholder="Ej: Ciclo de venta, Onboarding de clientes" required>
                    
                    <div class="checkbox-group">
                        <div>
                            <input type="checkbox" id="generate-manual" checked>
                            <label for="generate-manual">Generar Manual de Procesos</label>
                        </div>
                        <div>
                            <input type="checkbox" id="generate-orgchart" checked>
                            <label for="generate-orgchart">Generar Organigrama</label>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Generar Documentos</button>
                </form>
                <div id="result"></div>
            </section>
        </main>
    </div>

    <script>
        const companyForm = document.getElementById('company-form');
        const resultDiv = document.getElementById('result');

        companyForm.onsubmit = async (e) => {
            e.preventDefault();
            const submitButton = companyForm.querySelector('button[type="submit"]');
            const data = {
                companyName: document.getElementById('company-name').value,
                companyDesc: document.getElementById('company-desc').value,
                departments: document.getElementById('departments').value.split(',').map(d => d.trim()).filter(Boolean),
                processes: document.getElementById('processes').value.split(',').map(p => p.trim()).filter(Boolean),
                generateManual: document.getElementById('generate-manual').checked,
                generateOrgchart: document.getElementById('generate-orgchart').checked
            };

            if (!data.generateManual && !data.generateOrgchart) {
                alert('Selecciona al menos un documento para generar.');
                return;
            }

            submitButton.disabled = true;
            resultDiv.innerHTML = `<p>Generando documentos...</p><div class="loader"></div>`;

            try {
                let manualUrl = null;
                let orgchartUrl = null;

                if (data.generateManual) {
                    const response = await fetch('https://primary-production-3b83.up.railway.app/webhook/mvp/manual', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ companyName: data.companyName, companyDesc: data.companyDesc, processes: data.processes })
                    });
                    if (!response.ok) throw new Error(`Error en Manual: ${response.status} ${response.statusText}`);
                    const result = await response.json();
                    manualUrl = result.downloadUrl;
                }

                if (data.generateOrgchart) {
                    const response = await fetch('https://primary-production-3b83.up.railway.app/webhook/mvp/organigrama', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ companyName: data.companyName, departments: data.departments })
                    });
                    if (!response.ok) throw new Error(`Error en Organigrama: ${response.status} ${response.statusText}`);
                    const result = await response.json();
                    orgchartUrl = result.downloadUrl;
                }

                let finalHtml = `<strong>¡Documentos listos!</strong><div class="download-links">`;
                if (manualUrl) finalHtml += `<a href="${manualUrl}" target="_blank" download>Descargar Manual</a>`;
                if (orgchartUrl) finalHtml += `<a href="${orgchartUrl}" target="_blank" download>Descargar Organigrama</a>`;
                finalHtml += `</div>`;
                resultDiv.innerHTML = finalHtml;

            } catch (error) {
                console.error('Error al generar documentos:', error);
                resultDiv.innerHTML = `<strong style="color: var(--danger-color);">Error:</strong> ${error.message}.`;
            } finally {
                submitButton.disabled = false;
            }
        };
    </script>
</body>
</html>
