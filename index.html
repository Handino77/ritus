<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simplifica tu Documentación Empresarial</title>
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
    form { margin-bottom: 20px; }
    input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; }
    button { padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background: #0056b3; }
    #auth-section, #app-section { display: none; }
    .hidden { display: none; }
    #result a { margin-right: 10px; }
  </style>
</head>
<body>
  <div id="auth-section">
    <h1>Bienvenido</h1>
    <button id="login-btn">Iniciar Sesión</button>
    <button id="register-btn">Registrarse</button>
  </div>

  <div id="app-section" class="hidden">
    <h1>Datos Básicos de la Empresa</h1>
    <form id="company-form">
      <label>Nombre de la Empresa:</label>
      <input type="text" id="company-name" required>

      <label>Descripción:</label>
      <textarea id="company-desc" required></textarea>

      <label>Departamentos (separados por comas):</label>
      <input type="text" id="departments" placeholder="Ej: Ventas, Marketing, HR" required>

      <label>Procesos Básicos (separados por comas):</label>
      <input type="text" id="processes" placeholder="Ej: Ventas, Reclutamiento" required>

      <div>
        <input type="checkbox" id="generate-manual" checked>
        <label for="generate-manual">Generar Manual</label>
      </div>
      <div>
        <input type="checkbox" id="generate-orgchart" checked>
        <label for="generate-orgchart">Generar Organigrama</label>
      </div>

      <button type="submit">Generar Documentos</button>
    </form>
    <button id="logout-btn">Cerrar Sesión</button>
    <div id="result"></div>
  </div>

  <script>
    const auth0 = new auth0.Auth0Client({
      domain: 'dev-6phie2e4mj7852ie.us.auth0.com', // Reemplaza con tu dominio de Auth0
      clientId: 'QcbaWxdZHkkOGSIeu6FyahgKKDvBMVSB', // Reemplaza con tu Client ID
      redirect_uri: window.location.origin,
      useRefreshTokens: true
    });

    const authSection = document.getElementById('auth-section');
    const appSection = document.getElementById('app-section');
    const loginBtn = document.getElementById('login-btn');
    const registerBtn = document.getElementById('register-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const companyForm = document.getElementById('company-form');
    const resultDiv = document.getElementById('result');

    async function updateUI() {
      const isAuthenticated = await auth0.isAuthenticated();
      authSection.style.display = isAuthenticated ? 'none' : 'block';
      appSection.classList.toggle('hidden', !isAuthenticated);
    }

    loginBtn.onclick = () => auth0.loginWithRedirect();
    registerBtn.onclick = () => auth0.loginWithRedirect({ authorizationParams: { screen_hint: 'signup' } });
    logoutBtn.onclick = () => auth0.logout({ returnTo: window.location.origin });

    companyForm.onsubmit = async (e) => {
      e.preventDefault();
      const data = {
        companyName: document.getElementById('company-name').value,
        companyDesc: document.getElementById('company-desc').value,
        departments: document.getElementById('departments').value.split(',').map(d => d.trim()),
        processes: document.getElementById('processes').value.split(',').map(p => p.trim()),
        generateManual: document.getElementById('generate-manual').checked,
        generateOrgchart: document.getElementById('generate-orgchart').checked
      };

      if (!data.generateManual && !data.generateOrgchart) {
        alert('Selecciona al menos un documento para generar.');
        return;
      }

      resultDiv.innerHTML = 'Generando...';
      const token = await auth0.getAccessTokenSilently();

      if (data.generateManual) {
        await fetch('https://primary-production-3b83.up.railway.app/webhook/mvp/manual', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            companyName: data.companyName,
            companyDesc: data.companyDesc,
            processes: data.processes
          })
        });
      }

      if (data.generateOrgchart) {
        await fetch('https://primary-production-3b83.up.railway.app/webhook/mvp/organigrama', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            companyName: data.companyName,
            departments: data.departments
          })
        });
      }

      resultDiv.innerHTML = 'Documentos generados: ';
      if (data.generateManual) resultDiv.innerHTML += '<a href="#">Descargar Manual PDF</a> ';
      if (data.generateOrgchart) resultDiv.innerHTML += '<a href="#">Descargar Organigrama PDF</a>';
    };

    (async () => {
      const query = window.location.search;
      if (query.includes('code=') && query.includes('state=')) {
        await auth0.handleRedirectCallback();
        window.history.replaceState({}, document.title, '/');
      }
      await updateUI();
    })();
  </script>
</body>
</html>
