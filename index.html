<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DocuGenius</title>
    <!-- Assuming any original styles or links would be here; keeping as is since not provided -->
</head>
<body>
    <div>
        <h1>DocuGenius</h1>
        <div>
            <div>
                💡 Nuevo: Ahora puedes seleccionar qué documentos generar y podrás descargarlos directamente desde aquí.
            </div>
            <div>
                <label>Nombre de la Empresa:</label>
                <input type="text" id="companyName">
            </div>
            <div>
                <label>Correo Electrónico:</label>
                <input type="email" id="email">
            </div>
            <div>
                <label>Selecciona los documentos a generar:</label>
                <div>
                    <div>
                        <input type="checkbox" id="manual" name="documents" value="manual">
                        <label for="manual">📋 Manual de Procedimientos</label>
                    </div>
                    <div>
                        <input type="checkbox" id="organigrama" name="documents" value="organigrama">
                        <label for="organigrama">🏢 Organigrama</label>
                    </div>
                </div>
            </div>
            <button onclick="generateDocuments()">Generar Documentos</button>
            <div id="dashboard" style="margin-top: 20px; display: none;">
                <h2>Documentos Generados</h2>
                <div id="downloadLinks"></div>
            </div>
        </div>
    </div>

    <script>
        async function generateDocuments() {
            const companyName = document.getElementById('companyName').value;
            const email = document.getElementById('email').value;
            const checkboxes = document.querySelectorAll('input[name="documents"]:checked');
            const documents = Array.from(checkboxes).map(cb => cb.value);

            if (!companyName || !email || documents.length === 0) {
                alert('Por favor, completa todos los campos y selecciona al menos un documento.');
                return;
            }

            const data = {
                companyName,
                email,
                documents
            };

            try {
                // Respecting the original n8n webhook connection; replace with your actual webhook URL
                const response = await fetch('https://your-n8n-webhook-url-here', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error('Error al generar documentos');
                }

                const result = await response.json();
                // Assuming n8n returns { manualUrl: 'url', organigramaUrl: 'url' } or similar
                // Adjust based on your n8n flow response structure

                const downloadLinks = document.getElementById('downloadLinks');
                downloadLinks.innerHTML = '';

                if (result.manualUrl) {
                    const link = document.createElement('a');
                    link.href = result.manualUrl;
                    link.download = 'manual_procedimientos.pdf'; // Assuming PDF; adjust as needed
                    link.textContent = 'Descargar Manual de Procedimientos';
                    link.style.display = 'block';
                    link.style.marginBottom = '10px';
                    downloadLinks.appendChild(link);
                }

                if (result.organigramaUrl) {
                    const link = document.createElement('a');
                    link.href = result.organigramaUrl;
                    link.download = 'organigrama.pdf'; // Assuming PDF; adjust as needed
                    link.textContent = 'Descargar Organigrama';
                    link.style.display = 'block';
                    link.style.marginBottom = '10px';
                    downloadLinks.appendChild(link);
                }

                document.getElementById('dashboard').style.display = 'block';
            } catch (error) {
                alert('Ocurrió un error: ' + error.message);
            }
        }
    </script>
</body>
</html>
